- task: AzureCLI@2
  displayName: "What If"

  inputs:
    azureSubscription: "SEM_NAZEV_SERVICE_CONNECTION"

    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      az account show

      echo "Connected to Azure"

      az deployment group what-if \
        --resource-group rg-p2s-lab \
        --template-file "./Private_endpoint/bicep/PE.bicep" \
        --parameters "./Private_endpoint/bicep/PE.bicepparam"