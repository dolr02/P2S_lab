trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    az bicep version
  displayName: "Check Bicep"

- script: |
    FILES=$(find . -name "*.bicep")

    for FILE in $FILES
    do
      echo "================================="
      echo "Validating $FILE"
      echo "================================="

      az bicep build --file "$FILE"

    done

  displayName: "Validate Bicep Files"